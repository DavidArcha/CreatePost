<div class="create-post-container">
  <h2 class="create-post-title">Create Post</h2>

  <div class="editor-wrapper">
    <ckeditor
      [editor]="Editor"
      [config]="editorConfig"
      [(ngModel)]="editorContent"
    ></ckeditor>
  </div>

  <div class="submit-wrapper">
    <button class="submit-btn" (click)="onSubmit()">Submit</button>
  </div>
</div>
